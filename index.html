<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PammeRose · Control Center</title>
    <meta name="description" content="PammeRose · Creative Studio · Control Center" />
    <link rel="stylesheet" href="styles.css?v=road-goal-2" />
    <script src="app.js?v=road-goal-2" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar" aria-label="Cabecera de PammeRose">
        <div class="brand-wrap">
          <img class="brand-mark" src="whiterose.png" alt="Logo de PammeRose" />
          <div class="brand-copy">
            <div class="brand-name">PAMMEROSE</div>
            <div class="brand-subtitle">CREATIVE UNIVERSE</div>
          </div>
        </div>

        <div class="date-wrap" id="headerDate">04 DE OCTUBRE DE 2026</div>

        <div class="heart-badge" aria-label="Badge de PR">
          <svg class="heart-svg" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 54c-1.8-1.4-15.8-12.2-22.8-19.4C2.4 28.6 5.4 14 18.1 14c5.2 0 8.7 2.6 13.9 8.1 5.2-5.5 8.7-8.1 13.9-8.1 12.7 0 15.7 14.6 8.9 20.6C47.8 41.8 33.8 52.6 32 54Z" />
          </svg>
          <span class="heart-text">PR</span>
        </div>
      </header>

      <section class="year-strip" aria-label="Calendario anual">
        <div class="year-block">2026</div>
        <div class="months-row" id="monthsRow"></div>
      </section>

      <main class="dashboard" aria-label="Dashboard principal">
        <section class="feature-panel">
          <div class="feature-visual">
            <img src="PammeRose_Base.png" alt="Avatar de PammeRose" />
          </div>
          <div class="feature-copy">
            <div class="feature-logo">PAMMEROSE</div>
            <div class="feature-subtitle">CREATIVE STUDIO · CONTROL CENTER</div>
          </div>
        </section>

        <aside class="progress-panel">
          <div class="progress-ring" aria-label="Road to 1000" id="progressRing">
            <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-bg" cx="60" cy="60" r="46"></circle>
              <circle class="ring-progress" cx="60" cy="60" r="46"></circle>
            </svg>
            <div class="progress-value" id="progressValue">91%</div>
          </div>
          <div class="progress-label" id="progressLabel">Road to 1000</div>
          <div class="progress-meta" id="progressMeta">1000 SUSCRIPTORES</div>
          <div class="progress-controls" aria-label="Configuración de la meta">
            <label class="progress-field">
              <span>Meta</span>
              <input id="goalSubscribersInput" type="number" min="1" step="1" value="1000" />
            </label>
          </div>
        </aside>
      </main>

      <section class="stats-grid" id="statsGrid" aria-label="Tarjetas de métricas"></section>

      <dialog class="metric-dialog" id="metricEditorDialog" aria-labelledby="metricEditorTitle">
        <form class="metric-dialog-form" id="metricEditorForm">
          <h2 id="metricEditorTitle">Editar indicador</h2>
          <label class="metric-editor-label" for="metricEditorValue" id="metricEditorLabel">Valor</label>
          <input class="metric-editor-input" id="metricEditorValue" type="number" min="0" step="1" required />
          <div class="metric-dialog-actions">
            <button class="metric-dialog-button metric-dialog-cancel" id="metricEditorCancel" type="button">Cancelar</button>
            <button class="metric-dialog-button metric-dialog-save" type="submit">Aceptar</button>
          </div>
        </form>
      </dialog>

      <section class="calendars-row" aria-label="Calendarios del mes">
        <article class="calendar-card" data-calendar-type="videos">
          <div class="calendar-head">
            <h3>VIDEOS PUBLICADOS</h3>
            <span class="calendar-count" id="videosCount">0</span>
          </div>
          <div class="calendar-month" id="videosMonth">OCTUBRE</div>
          <div class="calendar-grid" id="videosCalendar"></div>
        </article>

        <article class="calendar-card" data-calendar-type="streams">
          <div class="calendar-head">
            <h3>STREAMS REALIZADOS</h3>
            <span class="calendar-count" id="streamsCount">0</span>
          </div>
          <div class="calendar-month" id="streamsMonth">OCTUBRE</div>
          <div class="calendar-grid" id="streamsCalendar"></div>
        </article>
      </section>

      <section class="milestones-panel" aria-labelledby="milestonesTitle">
        <h2 id="milestonesTitle">Hitos del Camino</h2>
        <div class="milestones-content" id="milestonesContent"></div>
      </section>

      <section class="production-section" aria-labelledby="productionTitle">
        <h2 id="productionTitle">Producción</h2>
        <div class="production-grid" id="productionGrid"></div>
      </section>
    </div>
  </body>
</html>
